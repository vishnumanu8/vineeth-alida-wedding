<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial Emerald Velvet Gradient -->
    <radialGradient id="emeraldBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#103325" />
      <stop offset="48%" stop-color="#092017" />
      <stop offset="100%" stop-color="#05100B" />
    </radialGradient>

    <!-- Metallic Champagne Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C89D54" />
      <stop offset="50%" stop-color="#F5E2B8" />
      <stop offset="100%" stop-color="#D4A359" />
    </linearGradient>

    <!-- Monogram Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="630" fill="url(#emeraldBg)" />

  <!-- 2. Minimalist Gold Border -->
  <rect x="26" y="26" width="1148" height="578" rx="16" stroke="#D4A359" stroke-width="1" stroke-opacity="0.4" fill="none" />
  <rect x="34" y="34" width="1132" height="562" rx="10" stroke="#F0D49E" stroke-width="1" stroke-opacity="0.18" fill="none" />

  <!-- 3. Corner Ticks -->
  <path d="M 40 64 L 40 40 L 64 40" stroke="#D4AF37" stroke-width="2" fill="none" />
  <path d="M 1160 64 L 1160 40 L 1136 40" stroke="#D4AF37" stroke-width="2" fill="none" />
  <path d="M 40 566 L 40 590 L 64 590" stroke="#D4AF37" stroke-width="2" fill="none" />
  <path d="M 1160 566 L 1160 590 L 1136 590" stroke="#D4AF37" stroke-width="2" fill="none" />

  <!-- 4. Header Badge -->
  <g transform="translate(600, 95)">
    <line x1="-120" y1="0" x2="-80" y2="0" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.7" />
    <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#D4AF37" letter-spacing="4.2">
      THE WEDDING RECEPTION
    </text>
    <line x1="80" y1="0" x2="120" y2="0" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.7" />
  </g>

  <!-- 5. Modern Circular Monogram Crest -->
  <g transform="translate(600, 195)">
    <!-- Outer and Inner Rings -->
    <circle cx="0" cy="0" r="54" stroke="url(#goldMetallic)" stroke-width="1.2" stroke-opacity="0.45" fill="none" />
    <circle cx="0" cy="0" r="48" stroke="url(#goldMetallic)" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.35" fill="none" />

    <!-- Side Laurel Sprigs -->
    <path d="M -60 0 Q -56 -18 -44 -30 Q -50 -16 -48 0" stroke="url(#goldMetallic)" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M -60 0 Q -56 18 -44 30 Q -50 16 -48 0" stroke="url(#goldMetallic)" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M 60 0 Q 56 -18 44 -30 Q 50 -16 48 0" stroke="url(#goldMetallic)" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M 60 0 Q 56 18 44 30 Q 50 16 48 0" stroke="url(#goldMetallic)" stroke-width="1.2" fill="none" stroke-linecap="round" />

    <!-- Monogram Letters -->
    <text x="-24" y="15" text-anchor="middle" font-size="52" font-weight="600" fill="url(#goldMetallic)" font-family="'Cormorant Garamond', Georgia, serif" filter="url(#softGlow)">V</text>
    <text x="0" y="10" text-anchor="middle" font-size="36" font-weight="400" fill="#F0D49E" font-family="'Great Vibes', cursive" filter="url(#softGlow)">&amp;</text>
    <text x="24" y="15" text-anchor="middle" font-size="52" font-weight="600" fill="url(#goldMetallic)" font-family="'Cormorant Garamond', Georgia, serif" filter="url(#softGlow)">A</text>
  </g>

  <!-- 6. Couple Names (Large, Crisp & Ultra-Readable) -->
  <text x="600" y="345" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="72" font-weight="500" fill="#FAF6F0" letter-spacing="1">
    Vineeth <tspan font-family="'Great Vibes', cursive" font-size="64" fill="#E5C158">&amp;</tspan> Alida
  </text>

  <!-- 7. Divider -->
  <g transform="translate(600, 385)">
    <line x1="-110" y1="0" x2="-20" y2="0" stroke="url(#goldMetallic)" stroke-width="1" stroke-opacity="0.65" />
    <text x="0" y="4" text-anchor="middle" font-size="13" fill="#E5C158">✦</text>
    <line x1="20" y1="0" x2="110" y2="0" stroke="url(#goldMetallic)" stroke-width="1" stroke-opacity="0.65" />
  </g>

  <!-- 8. Reception Date -->
  <text x="600" y="445" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" font-style="italic" fill="#E5C158" letter-spacing="1">
    Thursday, 7 January 2027
  </text>

  <!-- 9. Venue & Location -->
  <text x="600" y="495" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#F0D49E" fill-opacity="0.88" letter-spacing="3">
    MANGROVE AQUAVENTURES • PARAVOOR, KERALA
  </text>

  <!-- 10. Warm Invitation Subtitle -->
  <text x="600" y="550" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="17" font-style="italic" fill="#FAF6F0" fill-opacity="0.65" letter-spacing="0.5">
    Together with our families, we cordially invite you
  </text>
</svg>
